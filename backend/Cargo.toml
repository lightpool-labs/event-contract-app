[package]
name = "event-contract-backend"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.96.0"

[workspace]

[dependencies]
axum = "0.7"
tokio = { version = "1.5.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.61"
thiserror = "1.0.21"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1.50"
bincode = "1.3"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }

lightpool-sdk = { path = "../../../crates/lightpool-sdk" }
